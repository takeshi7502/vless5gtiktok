<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121416" />
  <title>Quản trị cấp link | VLESS 5G TikTok</title>
  <link rel="stylesheet" href="/admin.css" />
  <script defer src="/admin.js"></script>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <div>
        <p class="eyebrow"><span class="pixel-spark" aria-hidden="true"></span> VLESS Gateway</p>
        <p class="brand">Quản trị cấp link</p>
      </div>
      <div class="header-actions">
        <button id="register-webhook" class="secondary-button" type="button" title="Đăng ký webhook Telegram" hidden>Webhook bot</button>
        <a href="/">Trang cấp link</a>
        <button id="logout" class="text-button" type="button" hidden>Đăng xuất</button>
      </div>
    </header>

    <p id="webhook-status" class="message header-message" role="status" aria-live="polite"></p>

    <p id="page-status" class="page-status" role="status" aria-live="polite">Đang kiểm tra phiên...</p>

    <section id="login-section" class="section login-section" aria-labelledby="login-title" hidden>
      <p class="section-label">Quản trị</p>
      <h1 id="login-title">Đăng nhập</h1>
      <form id="login-form">
        <label for="password">Mật khẩu quản trị</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button id="login-button" class="primary-button" type="submit">Đăng nhập</button>
      </form>
      <p id="login-status" class="message" role="status" aria-live="polite"></p>
    </section>

    <div id="dashboard" hidden>
      <section class="section overview" aria-labelledby="overview-title">
        <p class="section-label">Tổng quan</p>
        <h1 id="overview-title">Cấp link miễn phí</h1>
        <div class="overview-row">
          <p><strong id="issued-count">0</strong><span>client đã cấp</span></p>
          <p id="config-status" class="config-status">Đang tải cấu hình</p>
        </div>
        <p id="issued-status" class="message" role="status" aria-live="polite"></p>
      </section>

      <section class="section" aria-labelledby="policy-title">
        <div class="section-heading">
          <div>
            <p class="section-label">Client mới</p>
            <h2 id="policy-title">Cấu hình cấp phát</h2>
          </div>
        </div>

        <form id="policy-form">
          <div class="field-grid">
            <div class="field half-width">
              <label for="traffic-gb">Traffic Limit (GB)</label>
              <input id="traffic-gb" name="trafficGB" type="number" min="0" max="100000" step="0.01" required />
            </div>
            <div class="field half-width">
              <label for="client-group">Group</label>
              <input id="client-group" name="group" type="text" maxlength="64" value="free-web" required />
            </div>
            <div class="field half-width">
              <label for="ip-limit">IP Limit</label>
              <input id="ip-limit" name="ipLimit" type="number" min="0" max="100000" step="1" required />
            </div>
            <div class="field half-width">
              <label for="hwid-limit">HWID Limit</label>
              <input id="hwid-limit" name="hwidLimit" type="number" min="0" max="100" step="1" required />
            </div>
            <div class="field half-width">
              <label id="expiry-label" for="expiry-at">Expiry</label>
              <select id="legacy-expiry-mode" class="expiry-mode-label" aria-label="Expiry mode" hidden>
                <option value="days">Duration (days)</option>
                <option value="date">Expiry</option>
              </select>
              <input id="expiry-at" name="expiryAt" type="datetime-local" />
              <input id="expiry-days" name="expiryDays" type="number" min="1" max="3650" step="1" hidden disabled />
            </div>
            <div class="field">
              <label for="first-use">Start After First Use</label>
              <div class="switch-control">
                <input id="first-use" name="startAfterFirstUse" type="checkbox" role="switch" />
              </div>
            </div>
            <div class="field">
              <label for="auto-renew-days">Auto Renew (days)</label>
              <input id="auto-renew-days" name="autoRenewDays" type="number" min="0" max="3650" step="1" required />
            </div>
            <div class="field">
              <label for="renew-on-day">Renew on day</label>
              <input id="renew-on-day" name="renewOnDay" type="number" min="0" max="31" step="1" required />
            </div>
            <div class="field">
              <label for="max-renewals">Max renewals</label>
              <input id="max-renewals" name="maxRenewals" type="number" min="0" max="100000" step="1" required />
            </div>
            <div class="field">
              <label for="traffic-reset">Traffic Reset</label>
              <select id="traffic-reset" name="trafficReset">
                <option value="never">Never</option>
                <option value="hourly">Hourly</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div class="field">
              <label for="monthly-reset-day">Monthly reset day</label>
              <input id="monthly-reset-day" name="monthlyResetDay" type="number" min="1" max="31" step="1" required />
            </div>
            <div class="field full-width">
              <label for="subscription-base-url">URL gốc subscription</label>
              <input id="subscription-base-url" name="subscriptionBaseUrl" type="url" placeholder="https://vpn.example.com:2096/sub/" autocomplete="off" required />
            </div>
          </div>

          <details class="inbound-fieldset" open>
            <summary>Inbound áp dụng <span id="inbound-count" class="inbound-count"></span></summary>
            <fieldset class="inbound-options">
              <legend class="visually-hidden">Chọn inbound áp dụng</legend>
              <div class="inbound-tools">
                <button id="select-all" class="text-button" type="button">Chọn tất cả</button>
                <button id="clear-all" class="text-button" type="button">Bỏ chọn</button>
              </div>
              <div id="inbound-list" class="inbound-list"></div>
            </fieldset>
          </details>

          <div class="form-actions">
            <button id="save-policy" class="primary-button" type="submit">Lưu cấu hình</button>
            <button id="sync-clients" class="secondary-button" type="button">Đồng bộ client</button>
          </div>
          <p id="policy-status" class="message action-message" role="status" aria-live="polite"></p>
          <p id="sync-status" class="message" role="status" aria-live="polite"></p>
          <div id="sync-progress" class="sync-progress" hidden>
            <progress id="sync-progress-bar" max="1" value="0">0%</progress>
            <span id="sync-progress-label" class="message"></span>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
