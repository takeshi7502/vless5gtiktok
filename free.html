<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121416" />
  <title>Nhận link miễn phí | VLESS 5G TikTok</title>
  <link rel="stylesheet" href="/free.css" />
  <script defer src="/free-page.js"></script>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <div>
        <p class="eyebrow"><span class="pixel-spark" aria-hidden="true"></span> VLESS Gateway</p>
        <p class="brand">VLESS 5G TikTok</p>
      </div>
      <a class="home-link" href="/">Trang chính</a>
    </header>

    <section class="content" aria-labelledby="page-title">
      <p class="section-label">Link miễn phí</p>
      <h1 id="page-title">Kết nối Telegram</h1>
      <p class="intro">Liên kết bot để xác minh tài khoản và nhận link của bạn.</p>

      <div class="status" id="bot-status" data-state="loading" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-message">Đang kiểm tra bot...</span>
      </div>

      <div class="actions">
        <button id="open-bot" class="primary-button is-locked" type="button" disabled aria-disabled="true">
          <img src="/assets/icons/link.svg" alt="" aria-hidden="true" />
          <span>Mở bot Telegram</span>
        </button>
        <button id="retry" class="retry-button" type="button" hidden>Thử lại</button>
      </div>
      <p class="bot-name" id="bot-name" hidden></p>
    </section>
  </main>
</body>
</html>
